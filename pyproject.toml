[project]
name = "tripwire"
version = "0.1.0"
description = "Security and accuracy auditor for RAG systems over financial documents: prompt injection, data leakage and wrong-number answers."
readme = "README.md"
license = "MIT"
authors = [{ name = "Rodrigo Jimenez Alonso" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "qdrant-client[fastembed]>=1.12",
    "typer>=0.12",
]

[project.scripts]
tripwire = "tripwire.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
